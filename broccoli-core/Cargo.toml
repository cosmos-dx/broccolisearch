[package]
name = "broccoli_core"
version = "0.1.0"
edition = "2021"
description = "Native hot loops for broccolisearch (Architecture.md §6)"

[lib]
name = "broccoli_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
