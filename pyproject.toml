[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "broccolisearch"
version = "0.1.0"
description = "Search with a cost-based query optimizer across lexical, vector and structured indexes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# hnswlib is the rented ANN engine. Without it the vector index still works,
# exactly but exhaustively — so it is optional, not required.
ann = ["hnswlib>=0.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["broccoli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
